name: Android build benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: GitHub Actions
            artifact: github-actions
            runner: ubuntu-24.04
          - provider: Blacksmith
            artifact: blacksmith
            runner: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Initialize benchmark result
        env:
          BENCHMARK_PROVIDER: ${{ matrix.provider }}
          BENCHMARK_RESULT: ${{ runner.temp }}/benchmark-${{ matrix.artifact }}.txt
        run: |
          printf 'provider=%s\nseconds=not-run\nstatus=not-run\n' \
            "$BENCHMARK_PROVIDER" > "$BENCHMARK_RESULT"

      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK before timing
        env:
          ANDROID_NDK_VERSION: 27.1.12297006
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          "$sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"

      - name: Download Gradle wrapper before timing
        working-directory: android
        run: ./gradlew --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Create release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties

      - name: Build signed release APK
        working-directory: android
        env:
          BENCHMARK_PROVIDER: ${{ matrix.provider }}
          BENCHMARK_RESULT: ${{ runner.temp }}/benchmark-${{ matrix.artifact }}.txt
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -f '%e\n%P\n%M' -o "$RUNNER_TEMP/gradle-build-time.txt" \
            ./gradlew :app:assembleRelease --profile
          build_status=$?
          set -e

          if [[ -f "$RUNNER_TEMP/gradle-build-time.txt" ]]; then
            build_seconds="$(sed -n '1p' "$RUNNER_TEMP/gradle-build-time.txt")"
            cpu_percent="$(sed -n '2p' "$RUNNER_TEMP/gradle-build-time.txt")"
            max_rss_kb="$(sed -n '3p' "$RUNNER_TEMP/gradle-build-time.txt")"
          else
            build_seconds=not-recorded
            cpu_percent=not-recorded
            max_rss_kb=not-recorded
          fi

          if [[ "$build_status" -eq 0 ]]; then
            result_status=success
          else
            result_status=failure
          fi

          printf 'provider=%s\nseconds=%s\ncpu_percent=%s\nmax_rss_kb=%s\nstatus=%s\n' \
            "$BENCHMARK_PROVIDER" "$build_seconds" "$cpu_percent" \
            "$max_rss_kb" "$result_status" > "$BENCHMARK_RESULT"
          exit "$build_status"

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.artifact }}
          path: ${{ runner.temp }}/benchmark-${{ matrix.artifact }}.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Gradle profile and resource metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/gradle-build-time.txt
            android/build/reports/profile/
          if-no-files-found: warn
          retention-days: 1

      - name: Remove release signing files
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties

  summarize:
    name: Compare build times
    if: always()
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: benchmark-results
          merge-multiple: true

      - name: Add timing comparison to workflow summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          rows = {}
          for result_file in Path("benchmark-results").glob("benchmark-*.txt"):
              values = {}
              for line in result_file.read_text().splitlines():
                  key, value = line.split("=", 1)
                  values[key] = value
              rows[values["provider"]] = values

          providers = ("GitHub Actions", "Blacksmith")
          summary = [
              "## Android release build benchmark",
              "",
              "Elapsed time for `:app:assembleRelease` (including signing). "
              "Checkout, toolchain setup, and other workflow steps are excluded. "
              "Gradle startup, dependency resolution, task execution, and signing are included.",
              "",
              "| Provider | Build time | CPU utilization | Peak memory | Result |",
              "| --- | ---: | ---: | ---: | --- |",
          ]

          for provider in providers:
              result = rows.get(provider)
              if result is None:
                  summary.append(
                      f"| {provider} | not recorded | not recorded | not recorded | no result artifact |"
                  )
                  continue

              seconds = result["seconds"]
              if seconds.replace(".", "", 1).isdigit():
                  seconds = f"{float(seconds):.1f}s"
              summary.append(
                  f"| {provider} | {seconds} | {result.get('cpu_percent', 'not recorded')} "
                  f"| {result.get('max_rss_kb', 'not recorded')} KB | {result['status']} |"
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary_file:
              summary_file.write("\n".join(summary) + "\n")
          PY
